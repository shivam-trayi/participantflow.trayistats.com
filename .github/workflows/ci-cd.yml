name: Node.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'

    - name: npm install, build
      run: |
        npm install
        CI='' npm run build:production --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job 
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Copy To Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.IIS_SERVER_HOST }}
          username: ${{ vars.IIS_SERVER_USERNAME }}
          password: ${{ secrets.IIS_SERVER_PASSWORD }}
          source: "."
          target: C:\inetpub\wwwroot\trayistatsPlatform\participantflow.trayistats.com\${{ github.run_id }}

      - name: Make Dir For Current Deplyment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.IIS_SERVER_HOST }}
          username: ${{ vars.IIS_SERVER_USERNAME }}
          password: ${{ secrets.IIS_SERVER_PASSWORD }}
          script: |
            mkdir C:\inetpub\wwwroot\trayistatsPlatform\participantflow.trayistats.com\${{ github.run_number }}.${{ github.run_attempt }}
            
          
      - name: Backup From Live
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.IIS_SERVER_HOST }}
          username: ${{ vars.IIS_SERVER_USERNAME }}
          password: ${{ secrets.IIS_SERVER_PASSWORD }}
          script: | 
            xcopy C:\inetpub\wwwroot\trayistatsPlatform\participantflow.trayistats.com\html\. C:\inetpub\wwwroot\trayistatsPlatform\participantflow.trayistats.com\${{ github.run_number }}.${{ github.run_attempt }}\ /E /C /H /R /K /O /Y

      - name: Remove all files
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.IIS_SERVER_HOST }}
          username: ${{ vars.IIS_SERVER_USERNAME }}
          password: ${{ secrets.IIS_SERVER_PASSWORD }}
          script: | 
            C:\inetpub\wwwroot\configurations\trayistatsPlatform\participantflow.trayistats.com\delete.bat

      - name: Deploy To Live
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.IIS_SERVER_HOST }}
          username: ${{ vars.IIS_SERVER_USERNAME }}
          password: ${{ secrets.IIS_SERVER_PASSWORD }}
          script: | 
            xcopy C:\inetpub\wwwroot\trayistatsPlatform\participantflow.trayistats.com\${{ github.run_id }}\. C:\inetpub\wwwroot\trayistatsPlatform\participantflow.trayistats.com\html\ /E /C /H /R /K /O /Y

      - name: Copy Configurations
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.IIS_SERVER_HOST }}
          username: ${{ vars.IIS_SERVER_USERNAME }}
          password: ${{ secrets.IIS_SERVER_PASSWORD }}
          script: | 
            xcopy C:\inetpub\wwwroot\configurations\trayistatsPlatform\participantflow.trayistats.com\web.config C:\inetpub\wwwroot\trayistatsPlatform\participantflow.trayistats.com\html\ /E /C /H /R /K /O /Y

      - name: Remove Dir
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.IIS_SERVER_HOST }}
          username: ${{ vars.IIS_SERVER_USERNAME }}
          password: ${{ secrets.IIS_SERVER_PASSWORD }}
          script: | 
            rmdir /s /q C:\inetpub\wwwroot\trayistatsPlatform\participantflow.trayistats.com\${{ github.run_id }}

      - name: Restart IIS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.IIS_SERVER_HOST }}
          username: ${{ vars.IIS_SERVER_USERNAME }}
          password: ${{ secrets.IIS_SERVER_PASSWORD }}
          script: |
            %windir%\system32\inetsrv\appcmd.exe recycle apppool /apppool.name:"participantflow.trayistats.com"

